services:

  postgres:
    image: postgres:16
    container_name: appointment-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: appointment_user
      POSTGRES_PASSWORD: Appointment@123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - appointment-network


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: appointment-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Admin@12345

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - appointment-network


volumes:
  postgres_data:


networks:
  appointment-network:
    driver: bridge