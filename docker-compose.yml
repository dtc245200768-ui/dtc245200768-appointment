version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: appointment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: appointment_user
      POSTGRES_PASSWORD: Appointment@123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appointment-network

  prometheus:
    image: prom/prometheus:latest
    container_name: appointment-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - appointment-network

  grafana:
    image: grafana/grafana:latest
    container_name: appointment-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - appointment-network

  loki:
    image: grafana/loki:latest
    container_name: appointment-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - appointment-network

  promtail:
    image: grafana/promtail:latest
    container_name: appointment-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - appointment-network

  nginx:
    image: nginx:latest
    container_name: appointment-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - appointment-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: appointment-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: Appointment@123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - appointment-network

  app:
    build: ./app
    container_name: appointment-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=appointment_db
      - DB_USER=appointment_user
      - DB_PASSWORD=Appointment@123
    depends_on:
      - postgres
    networks:
      - appointment-network

volumes:
  postgres_data:

networks:
  appointment-network:
    driver: bridge